<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05061a" />
    <title>Diamond Dash</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #05061a; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #cfd8ff;
        font: 300 18px/1.4 'Outfit', system-ui, sans-serif; letter-spacing: .2em; text-align: center; background: #05061a; z-index: 2; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">GIRE O APARELHO</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
